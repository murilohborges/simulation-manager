# docker-compose.yml (na raiz, ao lado de .git)
version: "3.8"

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: SimulationManagerDb
      MYSQL_USER: simulationuser
      MYSQL_PASSWORD: password123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - simulationmanager

networks:
  simulationmanager:
    driver: bridge

volumes:
  mysql_data:
